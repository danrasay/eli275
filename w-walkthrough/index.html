/* ELI course material design system, deck variant: flat fields, zero radius, no shadows. */
:root{
  --orange:#EB5600;
  --orange-hover:#E87722;
  --burnt:#BF5700;
  --teal:#1A9988;
  --ink:#1A1A1A;
  --body:#2D2D2D;
  --muted:#555555;
  --hairline:#D9D9D9;
  --white:#FFFFFF;
  --cream:#FFF8F0;
  --display:"Raleway","Helvetica Neue",Arial,sans-serif;
  --text:"Lato","Helvetica Neue",Arial,sans-serif;
  --gut:20px;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;display:flex;flex-direction:column;min-height:100vh;background:var(--cream);color:var(--body);font-family:var(--text);font-size:16px;line-height:1.45}
.top{padding:12px var(--gut);background:var(--white);border-top:6px solid var(--orange);border-bottom:1px solid var(--hairline)}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 5px}
.bars{display:inline-flex;gap:4px;flex:none}
.bars i{display:block;width:37px;height:0;border-top:5px solid var(--teal)}
.bars i + i{border-top-color:var(--orange)}
.course{font:700 14px/1.2 var(--display);color:var(--ink)}
h1{margin:0;font:700 24px/1.15 var(--display);color:var(--ink)}
main{flex:1;padding-block:28px;padding-inline:var(--gut)}
.gate{max-width:520px;padding:16px 18px 18px;background:var(--white);border-left:7px solid var(--orange)}
.gate p{margin:0}
.lead{color:var(--body)}
label{display:block;margin:14px 0 6px;font-size:14px;font-weight:700;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px}
input{flex:1 1 220px;min-width:0;min-height:44px;padding:8px 10px;border:1px solid var(--ink);background:var(--white);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--burnt);outline-offset:2px}
.btn{min-height:44px;padding:8px 18px;border:1px solid var(--orange);background:var(--orange);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--orange-hover);border-color:var(--orange-hover);transition:background-color 120ms linear,border-color 120ms linear}
.btn:active{background:var(--burnt);border-color:var(--burnt);color:var(--white)}
.btn:disabled{background:var(--white);border-color:var(--hairline);color:#767676;cursor:default}
.msg{min-height:1.45em;margin-top:10px!important;font-size:14px;color:var(--ink)}
.msg.err{padding-left:8px;border-left:4px solid var(--burnt);font-weight:700}
footer{padding:9px var(--gut);background:var(--white);border-top:1px solid var(--hairline);font-size:12px;line-height:1.4;color:var(--muted)}
@media (max-width:899.98px){ :root{--gut:16px} h1{font-size:20px} }
</style>

<script>
// The walkthrough is stored encrypted (AES-GCM, key from the password by PBKDF2-SHA256).
// It opens in this tab only when the password is right; the key is remembered for this tab.
(function () {
  'use strict';
  var L = JSON.parse(document.getElementById('locked').textContent);
  var REMEMBER = 'eli275-w-walkthrough-key';
  var form = document.getElementById('gate'), pw = document.getElementById('pw'), go = document.getElementById('go'), msg = document.getElementById('msg');

  function bytes(b64) {
    var s = atob(b64), a = new Uint8Array(s.length);
    for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
    return a;
  }
  function base64(buf) {
    var a = new Uint8Array(buf), s = '';
    for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
    return btoa(s);
  }
  function keyFor(password) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']).then(function (base) {
      return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(L.salt), iterations: L.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    });
  }
  function unlock(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(L.iv) }, key, bytes(L.data)).then(function (plain) {
      return new TextDecoder().decode(plain);
    });
  }
  function parsed() {
    return new Promise(function (done) {
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { done(); }, { once: true });
      else done();
    });
  }
  function show(html) {
    return parsed().then(function () {
      document.open();
      document.write(html);
      document.close();
    });
  }
  function say(text, isError) {
    msg.textContent = text;
    msg.className = isError ? 'msg err' : 'msg';
  }

  if (!window.crypto || !crypto.subtle || !window.TextEncoder) {
    say('This browser cannot open the page. Use a current version of Chrome, Safari, Firefox or Edge.', true);
    go.disabled = true;
    return;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!pw.value) { say('Enter the password first.', true); pw.focus(); return; }
    go.disabled = true;
    say('Opening the walkthrough.', false);
    var key;
    keyFor(pw.value).then(function (k) { key = k; return unlock(k); }).then(function (html) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        try { sessionStorage.setItem(REMEMBER, base64(raw)); } catch (err) { /* private mode: ask again next time */ }
        return show(html);
      });
    }).catch(function () {
      go.disabled = false;
      say('That password did not open the walkthrough. Check it and try again.', true);
      pw.select();
    });
  });

  var saved = null;
  try { saved = sessionStorage.getItem(REMEMBER); } catch (err) { saved = null; }
  if (saved) {
    form.hidden = true;
    crypto.subtle.importKey('raw', bytes(saved), 'AES-GCM', false, ['decrypt']).then(unlock).then(show).catch(function () {
      try { sessionStorage.removeItem(REMEMBER); } catch (err) { /* nothing to clear */ }
      form.hidden = false;
      pw.focus();
    });
  } else {
    pw.focus();
  }
})();
